<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sam's News — a tiny reader behind a huge newspaper">
  <!-- badge -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#f6ad3c"/>

  <!-- tiny legs + shoes sticking out below the paper (person dwarfed by it) -->
  <g>
    <rect x="26.5" y="45" width="4" height="10" rx="2" fill="#1c1c1c"/>
    <rect x="33.5" y="45" width="4" height="10" rx="2" fill="#1c1c1c"/>
    <rect x="24.5" y="54" width="7" height="3.5" rx="1.75" fill="#1c1c1c"/>
    <rect x="32.5" y="54" width="7" height="3.5" rx="1.75" fill="#1c1c1c"/>
  </g>

  <!-- the very large newspaper -->
  <rect x="14" y="9" width="36" height="40" rx="2.5" fill="#fbfaf5" stroke="#1c1c1c" stroke-width="2"/>
  <!-- centre fold -->
  <line x1="32" y1="11" x2="32" y2="47" stroke="#e0dccb" stroke-width="1.4"/>
  <!-- masthead -->
  <rect x="18" y="14" width="28" height="4.5" rx="1" fill="#1c1c1c"/>
  <!-- column text lines -->
  <g stroke="#9a978c" stroke-width="1.5" stroke-linecap="round">
    <line x1="18.5" y1="23" x2="29" y2="23"/>
    <line x1="18.5" y1="27.5" x2="29" y2="27.5"/>
    <line x1="18.5" y1="32" x2="29" y2="32"/>
    <line x1="18.5" y1="36.5" x2="29" y2="36.5"/>
    <line x1="35" y1="23" x2="45.5" y2="23"/>
    <line x1="35" y1="27.5" x2="45.5" y2="27.5"/>
    <line x1="35" y1="32" x2="45.5" y2="32"/>
    <line x1="35" y1="36.5" x2="45.5" y2="36.5"/>
  </g>

  <!-- tiny hands gripping the edges -->
  <circle cx="14" cy="31" r="3.2" fill="#f3c7a1" stroke="#1c1c1c" stroke-width="1.3"/>
  <circle cx="50" cy="31" r="3.2" fill="#f3c7a1" stroke="#1c1c1c" stroke-width="1.3"/>
</svg>
