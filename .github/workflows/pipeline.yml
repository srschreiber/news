name: news-pipeline

on:
  schedule:
    - cron: "0 13 * * *"    # daily  13:00 UTC
    - cron: "0 14 * * 0"    # weekly Sun 14:00 UTC
    - cron: "0 15 1 * *"    # monthly 1st 15:00 UTC
    - cron: "0 16 1 1 *"    # yearly Jan 1 16:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        type: choice
        default: daily
        options: [daily, weekly, monthly, yearly]

# Only one pipeline run at a time (they all commit to main).
concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write      # commit generated docs + state back to the repo
  pages: write         # deploy to GitHub Pages
  id-token: write      # OIDC for deploy-pages

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "0 14 * * 0") MODE="weekly" ;;
              "0 15 1 * *") MODE="monthly" ;;
              "0 16 1 1 *") MODE="yearly" ;;
              *)            MODE="daily" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py "${{ steps.mode.outputs.mode }}"

      - name: Commit results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs state.json metrics.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "news: ${{ steps.mode.outputs.mode }} run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
