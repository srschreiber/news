name: news-pipeline

on:
  schedule:
    # Hourly daily runs: 12:00–23:00 UTC = 5am–4pm PDT. Staying within a single
    # UTC day avoids date-boundary edge cases. The incremental run architecture
    # clusters only new RSS items each hour and merges them into today's event
    # store, so runs with nothing new exit cheaply after a timestamp update.
    - cron: "0 12-23 * * *"  # hourly 5am–4pm PDT
  workflow_dispatch: {}

# Only one pipeline run at a time (they all commit to main).
concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write      # commit generated docs + state back to the repo
  pages: write         # deploy to GitHub Pages
  id-token: write      # OIDC for deploy-pages

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_DEV_API_KEY: ${{ secrets.SERPER_DEV_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: python generate.py

      - name: Commit results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs state.json metrics.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "news: daily run $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    # Shared with publish-site so the two workflows never deploy Pages at once.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
