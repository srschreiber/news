site_name: Sam's News
site_description: Automated daily tech-news briefings, clustered and researched by Claude.
docs_dir: docs

# Shows a GitHub link (with live star/fork counts) in the header — click to star.
repo_url: https://github.com/srschreiber/news
repo_name: srschreiber/news

theme:
  name: material
  custom_dir: overrides    # footer star CTA (partials/copyright.html)
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    # Newspaper look: black masthead + amber accent.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/share.js
  - assets/api-status.js

plugins:
  - search
  - tags:
      tags_file: tags.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html

# Nav is intentionally minimal — index.md is the hub (regenerated each run)
# and is meant to be where people mostly stay: it aggregates every feed/topic
# with its own filters, so there's rarely a reason to browse to a dedicated
# feed/topic page. Those pages (docs/feeds/*.md, docs/topics/*.md) still
# build and are fully reachable by direct URL — from a home-page share link,
# a bookmark, or search — just not offered as a nav tree to click through.
# The custom keyword search lives at search.md alongside Material's built-in
# search.
nav:
  - Home: index.md
  - Podcast: podcast.md
  - Words: words.md
  - Facts: facts.md
  - Search: search.md
  - Donate: https://donate.stripe.com/8x2aEWacsatL7bq2IU8ww00

not_in_nav: |
  news/**
  feeds/**
  topics/**
  archive.md
  quiz.md

# The design spec lives under docs/ for repo convenience but isn't part of the
# published site.
exclude_docs: |
  superpowers/
