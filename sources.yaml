# News sources. Each entry:
#   name:  display name (required)
#   url:   a direct RSS/Atom feed              } one of url/query
#   query: a Google News topic search          } is required
#          (generate.py builds https://news.google.com/rss/search?q=<query>)
#   topic: which briefing file this feeds into (optional; default "general")
#
# Sources are grouped by `topic`: each topic produces its own daily file
# (docs/news/<topic>/YYYY-MM-DD.md) and its own weekly/monthly/yearly rollups,
# so e.g. gaming news never gets lumped in with security.
#
# Everything flows through the cheap Stage-1 clustering, so extra sources
# mostly cost input tokens, not research calls.

# Free-text editorial instructions appended to both LLM prompts (clustering +
# research). Use for house style or naming rules. Applied context-aware by the
# model (not a blind find/replace).
custom_instructions: |
  Refer to Donald Trump as "the president of the United States" rather than by name.

# Feeds group topics into broad sections. Each feed gets its own page + top
# stories (across its topics), and its own research budget (max stories the feed
# may web-research per run). The home page is divided into these feeds; a topic
# not listed in any feed falls into a synthesized "Other" feed.
feeds:
  technology:
    title: Technology
    research_budget: 4
    topics: [tech, ai, anthropic, gpt, security, email-security, gaming, golang, python, postgres]
  world:
    title: World
    research_budget: 2
    topics: [world, markets]
  science:
    title: Science
    research_budget: 2
    topics: [science, space, health]

# Web research (Stage 2: Haiku reads + Sonnet polishes) is the main cost. On by
# default; turned off for niche/low-value topics (rendered from RSS summaries).
# This is an additional per-topic gate on top of each feed's research_budget:
# a topic set false here is never researched even if its feed has budget left.
research:
  default: true
  topics:
    golang: false
    postgres: false
    python: false
    gaming: false
    markets: false

sources:
  # --- World news (non-tech) ---
  - name: "Google News — World"
    url: https://news.google.com/rss/headlines/section/topic/WORLD?hl=en-US&gl=US&ceid=US:en
    topic: world

  # --- General tech ---
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    topic: tech
  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    topic: tech
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    topic: tech
  - name: Wired
    url: https://www.wired.com/feed/rss
    topic: tech
  - name: Engadget
    url: https://www.engadget.com/rss.xml
    topic: tech
  - name: Hacker News (front page)
    url: https://hnrss.org/frontpage
    topic: tech
  - name: The Register
    url: https://www.theregister.com/headlines.atom
    topic: tech

  # --- Security ---
  # Direct feeds from reputable outlets (higher signal than a lone news query).
  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
    topic: security
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    topic: security
  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    topic: security
  - name: Dark Reading
    url: https://www.darkreading.com/rss.xml
    topic: security
  - name: The Record
    url: https://therecord.media/feed/
    topic: security
  - name: SecurityWeek
    url: https://www.securityweek.com/feed/
    topic: security
  - name: Schneier on Security
    url: https://www.schneier.com/feed/atom/
    topic: security
  - name: "CISA Advisories"
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    topic: security
  - name: "Google News — cybersecurity"
    query: "cybersecurity breach vulnerability"
    topic: security

  # --- Email security --- (few pure-RSS outlets; mix vendor research + queries)
  - name: "Proofpoint — Threat Insight"
    url: https://www.proofpoint.com/us/rss.xml
    topic: email-security
  - name: "Microsoft Security Blog"
    url: https://www.microsoft.com/en-us/security/blog/feed/
    topic: email-security
  - name: "Google News — email security"
    query: "email security phishing OR BEC OR \"email threat\""
    topic: email-security
  - name: "Google News — business email compromise"
    query: "\"business email compromise\" OR \"email account takeover\""
    topic: email-security
  - name: "Google News — phishing campaigns"
    query: "phishing campaign OR \"phishing attack\""
    topic: email-security

  # --- Gaming ---
  - name: "Google News — gaming"
    query: "gaming news"
    topic: gaming

  # --- AI ---
  - name: "Google News — AI models"
    query: "AI model release LLM"
    topic: ai
  - name: "Google News — Anthropic"
    query: "Anthropic Claude"
    topic: anthropic
  - name: "Google News — OpenAI GPT"
    query: "OpenAI GPT"
    topic: gpt

  # --- Languages & data ---
  - name: "Google News — PostgreSQL"
    query: "PostgreSQL"
    topic: postgres
  - name: "Google News — Go language"
    query: "Golang OR \"Go programming language\""
    topic: golang
  - name: "Google News — Python"
    query: "Python programming language"
    topic: python

  # --- Markets ---
  - name: "Google News — markets"
    query: "stock market news"
    topic: markets

  # === SCIENCE FEED ===
  # --- General science ---
  - name: ScienceDaily
    url: https://www.sciencedaily.com/rss/top/science.xml
    topic: science
  - name: "Phys.org"
    url: https://phys.org/rss-feed/
    topic: science
  - name: "Quanta Magazine"
    url: https://www.quantamagazine.org/feed/
    topic: science
  - name: "Google News — science"
    query: "science research discovery"
    topic: science

  # --- Space / NASA ---
  - name: "NASA — Breaking News"
    url: https://www.nasa.gov/rss/dyn/breaking_news.rss
    topic: space
  - name: "Space.com"
    url: https://www.space.com/feeds/all
    topic: space
  - name: "Google News — space"
    query: "space exploration NASA"
    topic: space

  # --- Health / Medicine ---
  - name: "ScienceDaily — Health"
    url: https://www.sciencedaily.com/rss/top/health.xml
    topic: health
  - name: "STAT News"
    url: https://www.statnews.com/feed/
    topic: health
  - name: "Google News — medical research"
    query: "medical research OR medicine breakthrough"
    topic: health
