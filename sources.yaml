# News sources. Each entry:
#   name:  display name (required)
#   url:   a direct RSS/Atom feed              } one of url/query
#   query: a Google News topic search          } is required
#          (generate.py builds https://news.google.com/rss/search?q=<query>)
#   topic: which briefing file this feeds into (optional; default "general")
#
# Sources are grouped by `topic`: each topic produces its own daily file
# (docs/news/<topic>/YYYY-MM-DD.md) and its own weekly/monthly/yearly rollups,
# so e.g. gaming news never gets lumped in with security.
#
# Everything flows through the cheap Stage-1 clustering, so extra sources
# mostly cost input tokens, not research calls.

# Free-text editorial instructions appended to both LLM prompts (clustering +
# research). Use for house style or naming rules. Applied context-aware by the
# model (not a blind find/replace).
custom_instructions: |
  Refer to Donald Trump as "the president of the United States" rather than by name.

# Feeds group topics into broad sections. Each feed gets its own page + top
# stories (across its topics), and its own research budget (max stories the feed
# may web-research per run). The home page is divided into these feeds; a topic
# not listed in any feed falls into a synthesized "Other" feed.
feeds:
  technology:
    title: Technology
    topics: [tech, ai, anthropic, gpt, security, email-security, golang, python, postgres, tech-research]
    scoring_context: >
      Score for a tech-industry reader. 5 = industry-shaping (landmark model release,
      critical zero-day exploited at scale, major platform shutdown). 3 = significant
      (notable product launch, substantial breach, widely-adopted tool). 1 = minor
      update or niche-only interest. For tech-research specifically: score for a CS
      researcher or ML practitioner — 5 = widely-cited breakthrough or new SOTA,
      3 = solid paper from a top venue/lab, 1 = incremental or narrow niche.
  world:
    title: World
    topics: [world, markets]
    scoring_context: >
      Score for a general news reader tracking global events and financial markets.
      5 = globally consequential (major military escalation, historic political event,
      severe market crash). 3 = significant (notable geopolitical development, major
      market move, meaningful policy change). 1 = local incident or routine report.
  science:
    title: Science
    topics: [science, space, health, diet-exercise]
    also_includes: [climate-resilience, climate-change, conservation]
    scoring_context: >
      Score for a science-curious reader, not against general-news events. 5 = landmark
      within science (Nobel-calibre discovery, major FDA approval, first-ever mission
      milestone). 3 = significant (well-replicated study with real-world implications,
      meaningful drug trial result, notable space mission update). 1 = routine research
      note or incremental finding. For diet-exercise: score for a health-conscious
      general reader — 5 = major dietary or exercise-science finding that changes
      guidance, 3 = solid study with practical takeaways, 1 = routine or niche finding.
  environment:
    title: Environment
    topics: [climate-resilience, climate-change, conservation]
    scoring_context: >
      Score for an ecologist, climate scientist, or conservationist reading beyond
      general news. 5 = landmark (major IPCC-caliber finding, breakthrough restoration
      or conservation method, large-scale synthesis across ecosystems). 3 = significant
      (well-designed field study or policy development with clear real-world
      implications). 1 = incremental or narrow local finding.
# Web research (Stage 2: Haiku reads + Sonnet polishes) is the main cost. On by
# default; turned off for niche/low-value topics (rendered from RSS summaries).
# Each research-enabled topic (subfeed) gets its own budget — see
# RESEARCH_BUDGET_PER_TOPIC in generate.py — rather than sharing one per-feed pool.
research:
  default: true
  topics:
    golang: false
    postgres: false
    python: false
    markets: false

